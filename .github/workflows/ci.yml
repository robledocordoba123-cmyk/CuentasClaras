# Compila y corre las pruebas del backend en cada push y Pull Request.
# Testcontainers levanta PostgreSQL en el Docker que traen los runners de GitHub.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Maven + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
